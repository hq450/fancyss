# by: hq450
# --------------------------------------------------------------------------------------------------
# 1. 此smartdns配置文件用于fancyss DNS分流解析，DNS解析行为：国内优先（默认用国内DNS解析，除了被墙域名用国外DNS解析）
# 2. 具体：chnlist + white_list由chn组服务器解析，gfwlist + black_list由gfw组服务器解析，其余域名由chn组服务器解析
# 3. IPV6行为：开启chn组和default组域名的IPV6解析和双栈优选，gfw组域名关闭IPV6解析，IPV6不可用时自动关闭所有IPV6特性
# 4. 如果不懂如何配置，请不要随意修改，不然可能导致本地DNS污染，或者DNS无法解析，导致无法科学上网。
# 5. 如果修改请确保配置文件的监听端口为7913，修改配置后，你需要重启smartdns或者整个插件，才能生效。
# 6. smartdns相关文档请参考：https://github.com/pymumu/smartdns#smartdns
# --------------------------------------------------------------------------------------------------
# 优点: 国内CDN较好，因为未被chnlist收录的国内域名也会用国内上游解析
# 缺点: 国外CDN较弱，比如国外访问较慢的网站github.com，如果使用大陆白名单模式，就是希望其走代理，但是其域名是国内上游解析的。
# 建议: 建议使用gfw黑名单模式下可以使用此模式，大陆白名单模式和游戏模式下不使用此配置。
# --------------------------------------------------------------------------------------------------

# 监听端口：7913，当启用替换dnsmasq时，此处会自动替换为端口53
bind [::]:7913

# ------------ domain-set ---------------------
# chnlist，包含全部cn域名和近10万条非cn的国内域名：https://github.com/hq450/fancyss/blob/3.0/rules/chnlist.txt
domain-set -name chnlist -file /koolshare/ss/rules/chnlist.txt

# gfwlist，包含已知的被墙的域名：https://github.com/hq450/fancyss/blob/3.0/rules/gfwlist.txt
domain-set -name gfwlist -file /koolshare/ss/rules/gfwlist.txt

# udplist，用于在【附加功能】-【udp代理控制】中设置的需要走udp代理的域名
domain-set -name udplist -file /koolshare/ss/rules/udplist.txt

# rotlist，用于控制路由器自己的流量哪些域名走代理
domain-set -name rotlist -file /koolshare/ss/rules/router.txt

# white_list，用户自定义的域名白名单，不走代理
domain-set -name white_list -file /tmp/white_list.txt

# black_list，用户自定义的域名黑名单，走代理
domain-set -name black_list -file /tmp/black_list.txt

# ------------ domain-rules ---------------------
# chnlist域名由chn组服务器解析，对解析结果进行双栈ip优选，然后将结果写入chnlist,chnlist6的ipset里
domain-rules /domain-set:chnlist/ -p #4:chnlist,#6:chnlist6 -c ping,tcp:80,tcp:443 -r first-ping -d yes -n chn

# white_list域名由chn组服务器解析，对解析结果进行双栈ip优选，然后将结果写入white_list,white_list6的ipset里
domain-rules /domain-set:white_list/ -p #4:white_list,#6:white_list6 -c ping,tcp:80,tcp:443 -r first-ping -d yes -n chn

# gfwlist域名由gfw组服务器解析，解析结果写入gfwlist的ipset里，关闭测速模式，关闭IPV6解析
domain-rules /domain-set:gfwlist/ -p #4:gfwlist,#6:- -c none -a #6 -n gfw

# black_list域名由gfw组服务器解析，解析结果写入black_list的ipset里，关闭测速模式，关闭IPV6解析
domain-rules /domain-set:black_list/ -p #4:black_list,#6:- -c none -a #6 -n gfw

# udplist域名由gfw组服务器解析，解析结果写入udplist的ipset里，关闭测速模式，关闭IPV6解析
domain-rules /domain-set:udplist/ -p #4:udplist,#6:- -c none -a #6 -n gfw

# rotlist域名由gfw组服务器解析，解析结果写入router的ipset里，关闭测速模式，关闭IPV6解析
domain-rules /domain-set:rotlist/ -p #4:router,#6:- -c none -a #6 -n gfw

# 设置全局规则，如果开启，则未匹配规则的default组将会被归到chn组
# domain-rules /./ -p #4:gfwlist,#6:- -c none -a #6 -nameserver chn

# 测速模式选择，由于默认为国内dns解析，故开启测速
speed-check-mode ping,tcp:80,tcp:443

# 响应模式配置
response-mode first-ping

# 开启双栈优选
dualstack-ip-selection yes
dualstack-ip-selection-threshold 10

# 缓存大小，自动控制
# cache-size 32768

#缓存持久化
cache-persist yes

# 缓存文件，国内优先cache为smartdns_1.cache
cache-file /tmp/smartdns_1.cache

# 开启域名预获取
prefetch-domain yes

# 启用过期缓存服务
serve-expired yes

# 缓存超时时间
serve-expired-ttl 259200

# 配置过期缓存响应TTL (缓存中域名TTL超时时，返回给客户端的TTL时间，让客户端在下列TTL时间后再次查询)
serve-expired-reply-ttl 3

# cache定时保存
cache-checkpoint-time 86400

# 禁用IPV6解析
force-AAAA-SOA no

# force specific qtype return soa
force-qtype-SOA 65

# 设置 TTL
# rr-ttl 1800

# 允许返回给客户的最大IP数量
# max-reply-ip-num 5

# 日志记录
log-level info
log-file /tmp/smartdns_log.txt
log-size 2M
log-num 1

# 审计
audit-enable yes
audit-file /tmp/smartdns_audit.txt
audit-size 2M
audit-num 1

# 证书文件
ca-file /etc/ssl/certs/ca-certificates.crt

#--------------------------------
# blacklist-ip 0.0.0.0/8
blacklist-ip 10.0.0.0/8
# blacklist-ip 127.0.0.0/8
# blacklist-ip ::/128
# blacklist-ip ::1/128
#--------------------------------

# define proxy server
proxy-server socks5://127.0.0.1:23456 -name fancy_proxy

# 国内上游服务器：chn组，走直连解析。用于chnlist + white_list域名集合的DNS解析
# 因未排除默认组，此组还会用于没有任何匹配的域名的DNS解析，此时group为default
# 如果插件内设置了：追加ISP DNS，则117.50.10.10和117.50.60.30会在启动时自动替换为ISP DNS
server 117.50.10.10 -group chn -blacklist-ip
server 117.50.60.30 -group chn -blacklist-ip
server 223.5.5.5 -group chn -blacklist-ip
server 119.29.29.29 -group chn -blacklist-ip
server 114.114.114.114 -group chn -blacklist-ip
server 180.184.1.1 -group chn -blacklist-ip
server 1.2.4.8 -group chn -blacklist-ip
server 180.76.76.76 -group chn -blacklist-ip

# 国外上游服务器，gfw组，走代理解析。用于gfwlist + black_list域名集合的DNS解析
# 因为此配置文件默认使用gfw组，所以用-exclude-default-group将chn组排除出默认组
# 一般设置tcp DNS，并走代理解析就能达到最佳的远端解析效果。
server-tcp 8.8.8.8 -group gfw -exclude-default-group -proxy fancy_proxy
server-tcp 1.1.1.1 -group gfw -exclude-default-group -proxy fancy_proxy
# dot server
# server-tls dns.google.com -group gfw -proxy fancy_proxy -host-ip 8.8.8.8
# server-tls one.one.one.one -group gfw -proxy fancy_proxy -host-ip 1.1.1.1
