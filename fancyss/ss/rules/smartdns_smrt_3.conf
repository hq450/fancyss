# by: hq450
# --------------------------------------------------------------------------------------------------
# 1. 此smartdns配置文件用于fancyss DNS分流解析，DNS解析行为：国外优先（默认用国外DNS解析，除了国内域名用国内DNS解析）
# 2. 具体：chnlist + white_list由chn组服务器解析，gfwlist + black_list由gfw组服务器解析，其余域名由gfw组服务器解析
# 3. IPV6行为：开启chn组域名的IPV6解析和双栈优选，gfw组+default组域名关闭IPV6解析，IPV6不可用时自动关闭所有IPV6特性
# 4. 如果不懂如何配置，请不要随意修改，不然可能导致本地DNS污染，或者DNS无法解析，导致无法科学上网。
# 5. 如果修改请确保配置文件的监听端口为7913，修改配置后，你需要重启smartdns或者整个插件，才能生效。
# 6. smartdns相关文档请参考：https://github.com/pymumu/smartdns#smartdns
# --------------------------------------------------------------------------------------------------
# 优点: 综合解析效果最好，因为既不在gfwlist + black_list也不在chnlist + white_list内的域名，会进行判定。
# 缺点: 国外DNS解析可能会有一点点小泄露，有DNS洁癖的别用此模式
# 建议: 小白首选，适应所有代理模式：gfw黑名单，大陆白名单等。
# --------------------------------------------------------------------------------------------------

# 监听端口：7913，当启用替换dnsmasq时，此处会自动替换为端口53
bind [::]:7913

# ------------ domain-set ---------------------
# chnlist，包含全部cn域名和近10万条非cn的国内域名：https://github.com/hq450/fancyss/blob/3.0/rules_ng/chnlist.gz
domain-set -name chnlist -file /tmp/chnlist.txt

# gfwlist，包含已知的被墙的域名：https://github.com/hq450/fancyss/blob/3.0/rules_ng/gfwlist.gz
domain-set -name gfwlist -file /tmp/gfwlist.txt

# udplist，用于在【附加功能】-【udp代理控制】中设置的需要走udp代理的域名
domain-set -name udplist -file /koolshare/ss/rules/udplist.txt

# rotlist，用于控制路由器自己的流量哪些域名走代理
domain-set -name rotlist -file /koolshare/ss/rules/rotlist.txt

# white_list，用户自定义的域名白名单，不走代理
domain-set -name white_list -file /tmp/white_list.txt

# black_list，用户自定义的域名黑名单，走代理
domain-set -name black_list -file /tmp/black_list.txt

# block_list，需要屏蔽dns解析的域名名单，比如adobe相关域名，防止adobe软件弹非正版提示窗口
domain-set -name block_list -file /tmp/block_list.txt

# chnroute，用于default组解析结果过滤
conf-file /tmp/whitelist_ip.txt

# ------------ domain-rules ---------------------
# chnlist域名由chn组服务器解析，对解析结果进行双栈ip优选，然后将结果写入chnlist,chnlist6的ipset里
domain-rules /domain-set:chnlist/ -p #4:chnlist,#6:chnlist6 -c ping,tcp:80,tcp:443 -r first-ping -d yes -n chn

# white_list域名由chn组服务器解析，对解析结果进行双栈ip优选，然后将结果写入white_list,white_list6的ipset里
domain-rules /domain-set:white_list/ -p #4:white_list,#6:white_list6 -c ping,tcp:80,tcp:443 -r first-ping -d yes -n chn

# gfwlist域名由gfw组服务器解析，解析结果写入gfwlist的ipset里，关闭测速模式，关闭IPV6解析
domain-rules /domain-set:gfwlist/ -p #4:gfwlist,#6:- -c none -a #6 -n gfw

# black_list域名由gfw组服务器解析，解析结果写入black_list的ipset里，关闭测速模式，关闭IPV6解析
domain-rules /domain-set:black_list/ -p #4:black_list,#6:- -c none -a #6 -n gfw

# udplist域名由gfw组服务器解析，解析结果写入udplist的ipset里，关闭测速模式，关闭IPV6解析
domain-rules /domain-set:udplist/ -p #4:udplist,#6:- -c none -a #6 -n gfw

# rotlist域名由gfw组服务器解析，解析结果写入router的ipset里，关闭测速模式，关闭IPV6解析
domain-rules /domain-set:rotlist/ -p #4:router,#6:- -c none -a #6 -n gfw

# block_list屏蔽IPV4, IPV6解析
domain-rules /domain-set:block_list/ -a #

# 测速模式选择
speed-check-mode ping,tcp:80,tcp:443

# 响应模式配置
response-mode fastest-ip

# 开启双栈优选
dualstack-ip-selection yes
dualstack-ip-selection-threshold 10

# 缓存大小，自动控制
# cache-size 32768

#缓存持久化
cache-persist yes

# 缓存文件，智能判断cache为smartdns_3.cache
cache-file /tmp/smartdns_3.cache

# 开启域名预获取
prefetch-domain yes

# 启用过期缓存服务
serve-expired no
#关于预获取和过期缓存，有四种情况，需要分别讨论。
#情况1：开启预获取，开启过期缓存：缓存过期一定时间后，再次发送查询请求，缓存新结果。（与情况3相比，缓解开启预获取导致的CPU压力）
#情况2：关闭预获取，开启过期缓存：客户端查询时，即使该域名缓存已过期（TTL为0），仍然返回已缓存IP，同时向上查询并缓存最新结果。
#       若5s（默认值，可改）后客户端再此查询，则返回新结果。（与开启乐观缓存的AGH效果相同）
#情况3：开启预获取，关闭过期缓存：域名缓存即将过期（TTL即将为0）时，再次发送查询请求，缓存新结果。（效果最好，但请求频率较高）
#情况4：关闭预获取，关闭过期缓存：客户端查询时，若该域名缓存已过期（TTL为0），则向上查询，返回结果并缓存。

# 缓存超时时间
serve-expired-ttl 259200

# 配置过期缓存响应TTL (缓存中域名TTL超时时，返回给客户端的TTL时间，让客户端在下列TTL时间后再次查询)
serve-expired-reply-ttl 3

# cache定时保存
cache-checkpoint-time 86400

# 禁用IPV6解析
force-AAAA-SOA no

# force specific qtype return soa
force-qtype-SOA 65

# 设置 TTL
# rr-ttl 1800

# 允许返回给客户的最大IP数量
# max-reply-ip-num 5

# 日志记录
log-level info
log-file /tmp/smartdns_log.txt
log-size 2M
log-num 1

# 审计
audit-enable yes
audit-file /tmp/smartdns_audit.txt
audit-size 2M
audit-num 1

# 证书文件
ca-file /etc/ssl/certs/ca-certificates.crt

#--------------------------------
# blacklist-ip 0.0.0.0/8
blacklist-ip 10.0.0.0/8
# blacklist-ip 127.0.0.0/8
# blacklist-ip ::/128
# blacklist-ip ::1/128
#--------------------------------

# define proxy server
proxy-server socks5://127.0.0.1:23456 -name fancy_proxy

# chn组，国内上游服务器，走直连，用于解析{chnlist, white_list}的域名
# 1.加上-exclude-default-group参数，避免{chnlist, white_list}以外的域名通过chn组服务器查询
# 2.使用-blacklist-ip，过滤一些解析结果，比如127.0.0.1, 0.0.0.0以及一些常见的污染ip
# 3.使用尽可能多的上游dns服务器，以尽可能获得更多的解析结果，方便测速优选
# 4.如果插件内设置了：追加ISP DNS，则117.50.10.10和117.50.60.30会在启动时自动替换为ISP DNS
server 117.50.10.10 -group chn -blacklist-ip -exclude-default-group
server 117.50.60.30 -group chn -blacklist-ip -exclude-default-group
server 223.5.5.5 -group chn -blacklist-ip -exclude-default-group
server 119.29.29.29 -group chn -blacklist-ip -exclude-default-group
server 114.114.114.114 -group chn -blacklist-ip -exclude-default-group
server 180.184.1.1 -group chn -blacklist-ip -exclude-default-group
server 1.2.4.8 -group chn -blacklist-ip -exclude-default-group
server 180.76.76.76 -group chn -blacklist-ip -exclude-default-group

# gfw组，国外上游服务器，走代理，用于解析{gfwlist, black_list}的域名
# 1.加上-exclude-default-group参数，避免{gfwlist, black_list}以外的域名通过gfw组服务器查询
# 2.使用-proxy proxy参数，默认走socks5代理进行解析，由于部分代理比如naiveproxy不支持udp，所以这里用tcp上游服务器
# 3.使用-blacklist-ip，过滤一些解析结果，比如127.0.0.1, 0.0.0.0以及一些常见的污染ip
server-tcp 8.8.8.8 -group gfw -blacklist-ip -exclude-default-group -proxy fancy_proxy
server-tcp 1.1.1.1 -group gfw -blacklist-ip -exclude-default-group -proxy fancy_proxy

# default组，用于未匹配到{chnlist, white_list} + {gfwlist, black_list}的域名解析
# 1. default组同时使用国内DNS和国外DNS进行解析，国内DNS只接受解析到国内ip的结果（-whitelist-ip），国外组接受所有结果
# 2. 对default组的解析结果进行测速，且测速模式需要为fastest-ip，以避免国内DNS返回较快
# 3. 如果插件内设置了：追加ISP DNS，则117.50.10.10和117.50.60.30会在启动时自动替换为ISP DNS
server 117.50.10.10 -whitelist-ip -blacklist-ip
server 117.50.60.30 -whitelist-ip -blacklist-ip
server 223.5.5.5 -whitelist-ip -blacklist-ip
server 119.29.29.29 -whitelist-ip -blacklist-ip
server 114.114.114.114 -whitelist-ip -blacklist-ip
server 180.184.1.1 -whitelist-ip -blacklist-ip
server 1.2.4.8 -whitelist-ip -blacklist-ip
server 180.76.76.76 -whitelist-ip -blacklist-ip
server-tcp 8.8.8.8 -blacklist-ip -proxy fancy_proxy
server-tcp 1.1.1.1 -blacklist-ip -proxy fancy_proxy
